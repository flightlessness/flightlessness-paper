{{- define "main" -}}
<h1 class="mb-10">{{- .Title -}}</h1>
{{- $pages := .Pages -}}
{{- if $pages -}}
<div class="grid gap-4 sm:grid-cols-2">
  {{- range $pages.ByDate.Reverse -}}
  <a class="flex items-center justify-between rounded-lg border border-black/10 px-5 py-4 transition hover:bg-black/5 dark:border-white/15 dark:hover:bg-white/5" href="{{- .Permalink -}}">
    <span class="text-lg font-medium">{{- .Title -}}</span>
    <span class="text-sm opacity-60">{{- .Date.Format "2006-01-02" -}}</span>
  </a>
  {{- end -}}
</div>
{{- else -}}
<p class="opacity-60">暂无文章。</p>
{{- end -}}
{{- end -}}
