{{- define "main" -}}
<h1 class="mb-10">{{- .Title -}}</h1>

{{- $terms := .Data.Terms.Alphabetical -}}
{{- if $terms -}}
<div class="grid gap-4 sm:grid-cols-2">
  {{- range $terms -}}
  <a
    class="no-underline flex items-center justify-between rounded-lg border border-black/10 px-5 py-4 transition hover:bg-black/5 dark:border-white/15 dark:hover:bg-white/5"
    href="{{- .Page.Permalink -}}"
  >
    <span class="text-lg font-medium">{{- .Page.Title -}}</span>
    <span class="text-sm opacity-60">{{- .Count -}} 篇</span>
  </a>
  {{- end -}}
</div>
{{- else -}}
<p class="opacity-60">暂无分类。</p>
{{- end -}}
{{- end -}}
