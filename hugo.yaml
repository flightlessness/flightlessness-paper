baseURL: "https://flightlessness.github.io/flightlessness-paper/"
languageCode: "zh-cn"
title: "flightlessness"
theme: "paper"

enableRobotsTXT: true
enableGitInfo: true

taxonomies:
  category: categories
  tag: tags

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20

params:
  color: linen
  name: "flightlessness"
  bio: "流量为王的时代，个人博客就是撒向深渊的玫瑰瓣，我俯身倾听细微的回声。"
  github: "flightlessness"
  rss: true
  disableHLJS: false
  disablePostNavigation: false

module:
  imports:
    - path: github.com/nanxiaobei/hugo-paper
