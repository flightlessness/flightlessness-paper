baseURL: "https://flightlessness.github.io/flightlessness-paper/"
languageCode: "zh-cn"
title: "flightlessness"

enableRobotsTXT: true
enableGitInfo: true

taxonomies:
  category: categories
  tag: tags

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20

params:
  color: linen
  name: "flightlessness"
  bio: "我向互联网的深渊撒了几片花瓣，俯身倾听细微的回声。"
  github: "flightlessness"
  rss: true
  disableHLJS: false
  disablePostNavigation: false

module:
  imports:
    - path: github.com/nanxiaobei/hugo-paper
